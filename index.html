  const grid = document.getElementById('sounds-grid');
  grid.innerHTML = SOUNDS.map(s => `
    <div class="sound-card" data-sound="${s.id}" onclick="toggleSound('${s.id}')">
      <div class="card-content">
        <span class="sound-icon">${ICONS[s.icon] || ''}</span>
        <div class="sound-name">${s.name}</div>
        <div class="sound-desc">${s.desc}</div>
        <div class="sound-toggle"></div>
        <div class="volume-control" onclick="event.stopPropagation()" ontouchstart="event.stopPropagation()" onmousedown="event.stopPropagation()">
          <span class="volume-icon">${ICONS.volume}</span>
          <input type="range" class="volume-slider" min="0" max="100" value="50"
            oninput="onVolumeChange('${s.id}', this.value)">
        </div>
      </div>
    </div>
  `).join('');
}

function renderTimerPresets() {
  const container = document.getElementById('timer-presets');
  container.innerHTML = TIMER_PRESETS.map(m => `
    <button class="timer-preset-btn" data-minutes="${m}" onclick="selectTimerPreset(${m})">${m}分钟</button>
  `).join('');
}

function updateSoundCard(id) {
  const card = document.querySelector(`.sound-card[data-sound="${id}"]`);
  if (!card) return;
  const isActive = !!activeSounds[id];
  card.classList.toggle('active', isActive);
}

function updatePresetButtons() {
  const activeIds = new Set(Object.keys(activeSounds));
  document.querySelectorAll('.preset-btn').forEach(btn => {
    const preset = PRESETS.find(p => p.id === btn.dataset.preset);
    if (!preset) return;
    const allActive = preset.sounds.every(s => activeIds.has(s));
    btn.classList.toggle('active', allActive);
  });
}

function onVolumeChange(id, value) {
  const vol = value / 100;
  if (activeSounds[id]) {
    setVolume(id, vol);
  }
  if (smartModeActive) smartManualOverrideUntil = Date.now() + 300000;
}

// ===== Presets =====

function applyPreset(presetId) {
  const preset = PRESETS.find(p => p.id === presetId);
  if (!preset) return;

  // If clicking the same active preset, toggle it off
  if (activePreset === presetId) {
    Object.keys(activeSounds).forEach(id => stopSound(id, true));
    setTimeout(() => {
      SOUNDS.forEach(s => updateSoundCard(s.id));
      updatePresetButtons();
    }, 100);
    activePreset = null;
    return;
  }

  // Stop all current sounds immediately
  Object.keys(activeSounds).forEach(id => stopSound(id, true));

  // Start preset sounds
  setTimeout(() => {
    preset.sounds.forEach(id => startSound(id));
    preset.sounds.forEach(id => updateSoundCard(id));
    updatePresetButtons();
  }, 100);

  activePreset = presetId;
  // Smart mode: manual preset selection pauses auto-recommend for 5 minutes
  if (smartModeActive) smartManualOverrideUntil = Date.now() + 300000;
}

// ===== Timer =====

function selectTimerPreset(minutes) {
  if (timerRunning) return;
  selectedTimerPreset = minutes;
  timerDuration = minutes * 60;
  timerRemaining = timerDuration;

  document.querySelectorAll('.timer-preset-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.minutes) === minutes);
  });

  updateTimerDisplay();
  document.getElementById('timer-label').textContent = '已选择，点击开始';
}

function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (timerRemaining <= 0 && selectedTimerPreset === null) return;
  if (timerRemaining <= 0) {
    timerRemaining = timerDuration;
  }
  timerEndTime = Date.now() + timerRemaining * 1000;
  timerRunning = true;
  document.getElementById('timer-start').textContent = '暂停';
  document.getElementById('timer-label').textContent = '正在计时...';

  timerInterval = setInterval(() => {
    const now = Date.now();
    timerRemaining = Math.max(0, Math.round((timerEndTime - now) / 1000));
    updateTimerDisplay();

    // Fade out in last 30 seconds
    if (timerRemaining <= 30 && timerRemaining > 0) {
      const fadeRatio = timerRemaining / 30;
      Object.keys(activeSounds).forEach(id => {
        const sound = activeSounds[id];
        if (sound && sound.gainNode) {
          sound.gainNode.gain.value = sound.volume * fadeRatio;
        }
      });
    }

    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      document.getElementById('timer-start').textContent = '开始';
      document.getElementById('timer-label').textContent = '时间到，已自动停止';

      // Stop all sounds
      Object.keys(activeSounds).forEach(id => stopSound(id));
      setTimeout(() => {
        SOUNDS.forEach(s => updateSoundCard(s.id));
        updatePresetButtons();
      }, 600);
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  // Save remaining time based on current moment
  timerRemaining = Math.max(0, Math.round((timerEndTime - Date.now()) / 1000));
  document.getElementById('timer-start').textContent = '继续';
  document.getElementById('timer-label').textContent = '已暂停';
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerRemaining = 0;
  selectedTimerPreset = null;
  document.getElementById('timer-start').textContent = '开始';
  document.getElementById('timer-label').textContent = '选择时长开始';
  document.getElementById('timer-time').textContent = '--:--';
  document.querySelectorAll('.timer-preset-btn').forEach(btn => btn.classList.remove('active'));
}

function updateTimerDisplay() {
  const mins = Math.floor(timerRemaining / 60);
  const secs = timerRemaining % 60;
  document.getElementById('timer-time').textContent =
    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

// ===== Breathing Guide =====

function toggleBreathing() {
  if (breathingActive) {
    stopBreathing();
  } else {
    startBreathing();
  }
}

function startBreathing() {
  breathingActive = true;
  document.getElementById('breath-toggle').textContent = '停止引导';
  document.getElementById('breath-toggle').classList.add('active');
  breathCycle();
}

function stopBreathing() {
  breathingActive = false;
  clearTimeout(breathingTimeout);
  breathingTimeout = null;
  const circle = document.getElementById('breath-circle');
  const ring = document.querySelector('.breath-ring');
  circle.className = 'breath-circle';
  circle.style.transition = 'transform 0.5s ease-in-out';
  circle.style.transform = 'translate(-50%, -50%) scale(1)';
  circle.style.background = '';
  circle.style.borderColor = '';
  if (ring) ring.style.borderColor = '';
  document.getElementById('breath-text').textContent = '点击开始呼吸引导';
  document.getElementById('breath-toggle').textContent = '开始引导';
  document.getElementById('breath-toggle').classList.remove('active');
}

function breathCycle() {
  if (!breathingActive) return;
  if (breathMode === 'resonance') {
    breathCycleResonance();
    return;
  }
  const circle = document.getElementById('breath-circle');
  const text = document.getElementById('breath-text');

  // Inhale 4s
  circle.className = 'breath-circle inhale';
  text.textContent = '吸气...';
  breathingTimeout = setTimeout(() => {
    if (!breathingActive) return;
    // Hold 7s
    circle.className = 'breath-circle hold';
    text.textContent = '屏息...';
    breathingTimeout = setTimeout(() => {
      if (!breathingActive) return;
      // Exhale 8s
      circle.className = 'breath-circle exhale';
      text.textContent = '呼气...';
      breathingTimeout = setTimeout(() => {
        if (!breathingActive) return;
        circle.className = 'breath-circle';
        breathCycle();
      }, 8000);
    }, 7000);
  }, 4000);
}

// ===== Resonance Breathing (configurable frequency & ratio) =====

function breathCycleResonance() {
  if (!breathingActive) return;
  const circle = document.getElementById('breath-circle');
  const text = document.getElementById('breath-text');
  const ring = document.querySelector('.breath-ring');
  const timings = getBreathTimings();

  // Inhale
  circle.style.transition = `transform ${timings.inhaleMs}ms ease-in-out`;
  circle.style.transform = 'translate(-50%, -50%) scale(3)';
  updateBreathCircleColor(circle, ring, 'inhale');
  text.textContent = '吸气...';
  playBreathTone('inhale');

  breathingTimeout = setTimeout(() => {
    if (!breathingActive) return;
    // Exhale
    circle.style.transition = `transform ${timings.exhaleMs}ms ease-in-out`;
    circle.style.transform = 'translate(-50%, -50%) scale(1)';
    updateBreathCircleColor(circle, ring, 'exhale');
    text.textContent = '呼气...';
    playBreathTone('exhale');

    breathingTimeout = setTimeout(() => {
      if (!breathingActive) return;
      breathCycleResonance();
    }, timings.exhaleMs);
  }, timings.inhaleMs);
}

// Sync breath circle color with HRV state
function updateBreathCircleColor(circle, ring, phase) {
  if (!hrMonitorConnected || hrvState.hrvLevel === 'none') {
    // No HR monitor — default teal
    circle.style.background = 'radial-gradient(circle, rgba(45,212,160,0.5), rgba(20,184,166,0.08))';
    circle.style.borderColor = 'rgba(45,212,160,0.3)';
    if (ring) ring.style.borderColor = 'rgba(45,212,160,0.15)';
    return;
  }
  // Detect HR-breath sync: if HRV is high and we're in resonance mode, show green
  const isSynced = hrvState.hrvLevel === 'high' && breathMode === 'resonance';
  if (isSynced) {
    circle.style.background = 'radial-gradient(circle, rgba(52,211,153,0.6), rgba(52,211,153,0.1))';
    circle.style.borderColor = 'rgba(52,211,153,0.4)';
    if (ring) ring.style.borderColor = 'rgba(52,211,153,0.3)';
  } else if (hrvState.hrvLevel === 'medium') {
    circle.style.background = 'radial-gradient(circle, rgba(251,191,36,0.5), rgba(251,191,36,0.1))';
    circle.style.borderColor = 'rgba(251,191,36,0.3)';
    if (ring) ring.style.borderColor = 'rgba(251,191,36,0.2)';
  } else {
    // Low HRV — teal/cool tone
    circle.style.background = 'radial-gradient(circle, rgba(45,212,160,0.5), rgba(20,184,166,0.1))';
    circle.style.borderColor = 'rgba(45,212,160,0.3)';
    if (ring) ring.style.borderColor = 'rgba(45,212,160,0.15)';
  }
}

// ===== Background Particles =====

function initParticles() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  const PARTICLE_COUNT = 50;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2 + 0.5,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.2 - 0.1,
      alpha: Math.random() * 0.3 + 0.05,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Canvas is transparent — CSS background image shows through

    // HRV-driven particle color and speed
    let pColorR = 45, pColorG = 212, pColorB = 160;
    let speedMul = 1;
    if (hrMonitorConnected && hrvState.hrvLevel !== 'none') {
      if (hrvState.hrvLevel === 'high') {
        pColorR = 52; pColorG = 211; pColorB = 153; // green — relaxed
        speedMul = 0.7; // slower, calmer
      } else if (hrvState.hrvLevel === 'medium') {
        pColorR = 251; pColorG = 191; pColorB = 36; // amber — transitional
        speedMul = 1;
      } else {
        pColorR = 45; pColorG = 212; pColorB = 160; // teal — stressed
        speedMul = 1.3; // slightly faster
      }
    }

    // Particles
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${pColorR}, ${pColorG}, ${pColorB}, ${p.alpha})`;
      ctx.fill();

      p.x += p.dx * speedMul;
      p.y += p.dy * speedMul;

      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
    });

    requestAnimationFrame(draw);
  }
  draw();
}

// ===== Playback Controls =====

let isPaused = false;
let pausedVolumes = {};

function togglePauseAll() {
  const activeIds = Object.keys(activeSounds);
  if (activeIds.length === 0) return;

  if (isPaused) {
    // Resume: restore volumes
    activeIds.forEach(id => {
      const sound = activeSounds[id];
      if (sound && sound.gainNode && pausedVolumes[id] !== undefined) {
        sound.gainNode.gain.value = pausedVolumes[id];
      }
    });
    pausedVolumes = {};
    isPaused = false;
    document.getElementById('pause-icon').innerHTML = ICONS.pause;
    document.getElementById('pause-text').textContent = '全部暂停';
    document.getElementById('pause-btn').classList.remove('paused');
  } else {
    // Pause: save volumes then mute via GainNode (don't pause audio to avoid iOS issues)
    pausedVolumes = {};
    activeIds.forEach(id => {
      const sound = activeSounds[id];
      if (sound && sound.gainNode) {
        pausedVolumes[id] = sound.gainNode.gain.value;
        sound.gainNode.gain.value = 0;
      }
    });
    isPaused = true;
    document.getElementById('pause-icon').innerHTML = ICONS.play;
    document.getElementById('pause-text').textContent = '继续播放';
    document.getElementById('pause-btn').classList.add('paused');
  }
}

function resetAll() {
  // Stop all sounds
  Object.keys(activeSounds).forEach(id => stopSound(id, true));
  if (masterAudioElement) masterAudioElement.pause();
  isPaused = false;
  activePreset = null;
  if (smartModeActive) disableSmartMode();
  releaseWakeLock();

  // Reset UI
  setTimeout(() => {
    SOUNDS.forEach(s => updateSoundCard(s.id));
    updatePresetButtons();
    // Reset all volume sliders to 50
    document.querySelectorAll('.volume-slider').forEach(slider => slider.value = 50);
    document.getElementById('pause-icon').innerHTML = ICONS.pause;
    document.getElementById('pause-text').textContent = '全部暂停';
    document.getElementById('pause-btn').classList.remove('paused');
  }, 100);
}

// ===== Saved Configs =====

const CONFIGS_KEY = 'relax_saved_configs';

function getSavedConfigs() {
  try {
    return JSON.parse(localStorage.getItem(CONFIGS_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveConfigsToStorage(configs) {
  localStorage.setItem(CONFIGS_KEY, JSON.stringify(configs));
}

let pendingSaveSounds = null;
let pendingSaveDesc = null;

function saveCurrentConfig() {
  const activeIds = Object.keys(activeSounds);
  if (activeIds.length === 0) {
    showToast('请先开启至少一个声音再保存');
    return;
  }

  // Collect current volumes
  const sounds = {};
  activeIds.forEach(id => {
    sounds[id] = activeSounds[id].volume;
  });

  // Build description from sound names
  const desc = activeIds.map(id => {
    const s = SOUNDS.find(s => s.id === id);
    return s ? s.name : id;
  }).join(' + ');

  pendingSaveSounds = sounds;
  pendingSaveDesc = desc;

  // Show modal
  const input = document.getElementById('config-name-input');
  input.value = desc;
  document.getElementById('save-modal').classList.add('active');
  setTimeout(() => input.focus(), 100);
}

function closeSaveModal(event) {
  if (event && event.target !== event.currentTarget) return;
  document.getElementById('save-modal').classList.remove('active');
  pendingSaveSounds = null;
  pendingSaveDesc = null;
}

function confirmSaveConfig() {
  const name = document.getElementById('config-name-input').value.trim();
  if (!name) return;

  const configs = getSavedConfigs();
  const existing = configs.findIndex(c => c.name === name);

  const newConfig = {
    id: existing >= 0 ? configs[existing].id : Date.now().toString(),
    name: name,
    sounds: pendingSaveSounds,
    desc: pendingSaveDesc,
    createdAt: existing >= 0 ? configs[existing].createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };

  if (existing >= 0) {
    configs[existing] = newConfig;
  } else {
    configs.push(newConfig);
  }

  saveConfigsToStorage(configs);
  renderConfigs();
  closeSaveModal();
  showToast('配置已保存');
}

// Toast notification (replaces alert)
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.classList.add('active');
  setTimeout(() => toast.classList.remove('active'), 2000);
}

function loadConfig(configId) {
  const configs = getSavedConfigs();
  const config = configs.find(c => c.id === configId);
  if (!config) return;

  // Stop all current sounds
  Object.keys(activeSounds).forEach(id => stopSound(id, true));

  // Load saved sounds with their volumes
  setTimeout(() => {
    Object.entries(config.sounds).forEach(([id, vol]) => {
      startSound(id);
    });
    // After sounds start, apply saved volumes (cancel ongoing fades first)
    setTimeout(() => {
      Object.entries(config.sounds).forEach(([id, vol]) => {
        const sound = activeSounds[id];
        if (sound && sound.gainNode) {
          sound.fadeId++; // Cancel the fadeIn from startSound
          sound.volume = vol;
          sound.gainNode.gain.value = vol;
        }
        // Update volume slider
        const card = document.querySelector(`.sound-card[data-sound="${id}"]`);
        if (card) {
          const slider = card.querySelector('.volume-slider');
          if (slider) slider.value = Math.round(vol * 100);
        }
      });
      SOUNDS.forEach(s => updateSoundCard(s.id));
      updatePresetButtons();
    }, 300);
  }, 100);
  activePreset = null;
}

function deleteConfig(configId) {
  const configs = getSavedConfigs().filter(c => c.id !== configId);
  saveConfigsToStorage(configs);
  renderConfigs();
}

function renderConfigs() {
  const list = document.getElementById('configs-list');
  const configs = getSavedConfigs();

  if (configs.length === 0) {
    list.innerHTML = '<div class="configs-empty">还没有保存的配置，调整好声音后点击上方保存</div>';
    return;
  }

  list.innerHTML = configs.map(c => `
    <div class="config-item">
      <div class="config-item-info">
        <div class="config-item-name">${c.name}</div>
        <div class="config-item-desc">${c.desc}</div>
      </div>
      <div class="config-item-actions">
        <button class="config-item-btn load" onclick="loadConfig('${c.id}')">加载</button>
        <button class="config-item-btn delete" onclick="deleteConfig('${c.id}')">删除</button>
      </div>
    </div>
  `).join('');
}

// ===== Init =====

document.addEventListener('DOMContentLoaded', () => {
  renderPresets();
  renderSounds();
  renderConfigs();
  renderTimerPresets();
  initParticles();

  // Set initial SVG icons
  document.getElementById('pause-icon').innerHTML = ICONS.pause;
  document.getElementById('reset-icon').innerHTML = ICONS.reset;
  document.getElementById('hr-connect-icon').innerHTML = ICONS.heartPulse;
  document.getElementById('smart-toggle-icon').innerHTML = ICONS.brain;

  // iOS / unsupported browser fallback for Web Bluetooth
  if (!navigator.bluetooth) {
    const hrSection = document.getElementById('hr-monitor-section');
    if (hrSection) {
      hrSection.innerHTML = '<div class="section-title">心率生物反馈</div>' +
        '<div style="text-align:center;padding:16px;color:var(--text-muted);font-size:0.85rem;">' +
        '此浏览器不支持 Web Bluetooth<br>请在 Chrome 或 Edge 中打开，或在 iOS 上使用 BLE Link App</div>';
    }
  }

  // Unlock AudioContext on first user interaction (required for iOS Safari)
  const unlockAudio = () => {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
    // Activate the master <audio> element on first interaction — this is the key
    // to gaining iOS background audio permission (media session must start from user gesture)
    if (masterAudioElement && masterAudioElement.paused) {
      masterAudioElement.play().catch(e => console.log('masterAudioElement unlock:', e));
    }
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('touchend', unlockAudio);
    document.removeEventListener('click', unlockAudio);
  };
  document.addEventListener('touchstart', unlockAudio, { passive: true });
  document.addEventListener('touchend', unlockAudio, { passive: true });
  document.addEventListener('click', unlockAudio);

  // Handle Enter key in save modal input
  document.getElementById('config-name-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmSaveConfig();
  });

  // ===== Scroll Reveal with IntersectionObserver =====
  const revealSections = document.querySelectorAll('.presets, .sounds, .timer, .breathing, .configs, .hr-monitor');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  revealSections.forEach(section => revealObserver.observe(section));

  // ===== Staggered card entrance =====
  const staggerCards = (gridSelector, delayMs) => {
    const grid = document.querySelector(gridSelector);
    if (!grid) return;
    const cards = grid.children;
    for (let i = 0; i < cards.length; i++) {
      cards[i].style.opacity = '0';
      cards[i].style.transform = 'translateY(12px)';
      cards[i].style.transition = `opacity 0.5s var(--ease-out-expo) ${i * delayMs}ms, transform 0.5s var(--ease-out-expo) ${i * delayMs}ms`;
      requestAnimationFrame(() => {
        cards[i].style.opacity = '1';
        cards[i].style.transform = 'translateY(0)';
      });
    }
  };

  // Stagger after initial render
  setTimeout(() => {
    staggerCards('.presets-grid', 60);
    staggerCards('.sounds-grid', 40);
  }, 100);
});
